<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Delpinware</title>
    <link rel="stylesheet" href="formularios.css">
</head>
<body class="pagina-formulario">

    <!-- ✏️ NUEVO: Botón flotante para volver a la página principal -->
    <a href="../index.html" class="btn-inicio" title="Volver a la página principal">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        Inicio
    </a>

    <!-- Burbujas decorativas de fondo -->
    <div class="burbujas" aria-hidden="true">
        <span></span><span></span><span></span>
        <span></span><span></span><span></span>
    </div>

    <!-- Escenario 3D de la tarjeta -->
    <div class="card-escenario">
        <div class="tarjeta-3d" id="tarjeta3d">

            <!-- ==================== CARA FRONTAL: LOGIN ==================== -->
            <div class="cara cara-frontal">
                <img src="logo-img/Logo de la empresa 1.png" alt="Logo Delpinware" class="logo-form">
                <h1 class="titulo-form">Bienvenido de nuevo</h1>
                <p class="subtitulo-form">Inicia sesión para continuar con Delpinware</p>

                <form id="formLogin" novalidate>
                    <div class="input-grupo" id="grupoEmail">
                        <span class="icono-input">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m2 7 10 6 10-6"/></svg>
                        </span>
                        <input type="email" id="loginEmail" placeholder="Correo electrónico" autocomplete="email">
                    </div>
                    <p class="msg-error" id="errorEmail"></p>

                    <div class="input-grupo" id="grupoPass">
                        <span class="icono-input">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                        </span>
                        <input type="password" id="loginPass" placeholder="Contraseña" autocomplete="current-password">
                        <button type="button" class="btn-ojo" aria-label="Mostrar contraseña">
                            <svg class="icono-ojo-abierto" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                            <svg class="icono-ojo-cerrado" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/></svg>
                        </button>
                    </div>
                    <p class="msg-error" id="errorPass"></p>

                    <a href="https://mail.google.com/" target="_blank" rel="noopener" class="link-olvide">¿Olvidaste tu contraseña?</a>

                    <button type="submit" class="btn-enviar" id="btnLogin">
                        <span class="btn-texto">Iniciar Sesión</span>
                        <span class="spinner" hidden></span>
                    </button>
                </form>

                <p class="cambiar-form">
                    ¿No tienes cuenta?
                    <a href="#" class="flip-link">Regístrate</a>
                </p>
            </div>

            <!-- ==================== CARA TRASERA (✏️ con tiempo y salida al inicio) ==================== -->
            <div class="cara cara-trasera">
                <img src="logo-img/Logo de la empresa 1.png" alt="Logo Delpinware" class="logo-form">
                <h1 class="titulo-form">¡Únete a nosotros!</h1>
                <p class="subtitulo-form">Crea tu cuenta y accede a todos los proyectos de Delpinware.</p>
                <a href="registro.html" class="btn-enviar enlace-boton">Crear cuenta</a>
                <a href="#" class="flip-back">← Volver al inicio de sesión</a>
              
            </div>

        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="formularios.js"></script>
</body>
</html>
